<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Coin Orbit · Jogos three.js 接入示例</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; width: 100%; height: 100%; overflow: hidden;
      background: #05070f; color: #e8eefc;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-user-select: none; user-select: none; overscroll-behavior: none;
    }
    #app { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 10px; }
    #stage { position: relative; flex: 1; min-height: 0; width: 100%; border-radius: 12px; overflow: hidden; background: #070b16; }
    #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    .hud {
      position: absolute; left: 18px; right: 18px; top: 14px;
      display: flex; justify-content: space-between; pointer-events: none;
      font-weight: 700; font-size: 15px; color: #cfe0ff; text-shadow: 0 2px 8px rgba(0,0,0,.6);
    }
    .hud b { color: #fff; font-size: 18px; }
    #overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; }
    #overlay.show { display: flex; }
    .card {
      min-width: 240px; padding: 24px 26px; text-align: center;
      background: rgba(8,12,24,.92); border: 1px solid rgba(120,170,255,.25);
      border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.5);
    }
    .card h2 { margin: 0 0 6px; font-size: 22px; }
    .card p { margin: 0 0 18px; color: #8fa8d8; }
    .card p b { color: #fff; font-size: 20px; }
    .card button {
      display: block; width: 100%; margin-top: 8px; padding: 11px 18px;
      border: 0; border-radius: 10px; font: inherit; font-weight: 700; color: #fff; cursor: pointer;
    }
    #btn-again { background: linear-gradient(180deg, #3f7dff, #2b5cd8); }
    #btn-revive { background: linear-gradient(180deg, #ffab3d, #e2761c); }
    #btn-revive[hidden] { display: none; }
    #banner-slot { width: 320px; height: 50px; flex: 0 0 auto; border-radius: 6px; overflow: hidden; background: rgba(255,255,255,.03); }
    #loading {
      position: fixed; inset: 0; z-index: 9000; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px; background: #05070f; transition: opacity .3s;
    }
    #loading.hide { opacity: 0; pointer-events: none; }
    #loading h1 { margin: 0; font-size: 26px; letter-spacing: .04em; }
    #loading p { margin: 0; color: #8fa8d8; font-size: 13px; }
    #bar { width: min(360px, 70vw); height: 8px; border-radius: 999px; background: rgba(255,255,255,.08); overflow: hidden; }
    #bar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #3f7dff, #6ce0ff); transition: width .12s linear; }
  </style>
</head>
<body>
  <div id="app">
    <div id="stage">
      <canvas id="scene"></canvas>

      <div class="hud">
        <span>SCORE <b id="score">0</b></span>
        <span><b id="time">30</b>s</span>
      </div>

      <div id="overlay">
        <div class="card">
          <h2>Round Over</h2>
          <p>得分 <b id="final">0</b></p>
          <button id="btn-revive">看广告 +15 秒</button>
          <button id="btn-again">再来一局</button>
        </div>
      </div>
    </div>

    <div id="banner-slot"></div>
  </div>

  <div id="loading">
    <h1>Coin Orbit</h1>
    <p id="loading-tip">初始化 Jogos SDK…</p>
    <div id="bar"><i></i></div>
  </div>

  <script src="../../shared/page-shell.js"></script>
  <script src="../../shared/jogos-bridge.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
      }
    }
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
