<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Coin Orbit · Jogos three.js 接入示例</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; width: 100%; height: 100%; overflow: hidden;
      background: #05070f; color: #e8eefc;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
      overscroll-behavior: none;
    }
    #app { display: flex; width: 100%; height: 100%; gap: 12px; padding: 12px; }
    #stage { position: relative; flex: 1; min-width: 0; border-radius: 12px; overflow: hidden; background: #070b16; }
    #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #hud { position: absolute; inset: 0; pointer-events: none; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; }
    #hud .row { display: flex; justify-content: space-between; gap: 10px; }
    .chip { background: rgba(10,16,32,.72); border: 1px solid rgba(120,170,255,.22); border-radius: 999px; padding: 8px 14px; font-weight: 700; font-size: 15px; backdrop-filter: blur(6px); }
    .chip small { color: #8fa8d8; font-weight: 600; }
    #side { width: 310px; flex-shrink: 0; display: flex; flex-direction: column; gap: 10px; }
    .panel { background: rgba(14,22,42,.92); border: 1px solid rgba(120,170,255,.18); border-radius: 12px; padding: 12px; }
    .panel h3 { margin: 0 0 8px; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: #8fa8d8; }
    .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    button { font: inherit; font-size: 14px; font-weight: 650; color: #eaf1ff; background: #22305a; border: 1px solid rgba(120,170,255,.28); border-radius: 9px; padding: 10px 8px; cursor: pointer; }
    button:hover { background: #2b3c6e; }
    button.primary { background: linear-gradient(180deg, #3f7dff, #2b5cd8); border-color: #6b9bff; }
    button.warn { background: linear-gradient(180deg, #ff8a3d, #e2671c); border-color: #ffb37a; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    #banner-slot { width: 300px; height: 250px; border-radius: 10px; background: rgba(255,255,255,.03); display: flex; align-items: center; justify-content: center; color: #56709e; font-size: 12px; }
    #log { flex: 1; min-height: 80px; overflow: auto; margin: 0; padding: 8px; border-radius: 8px; background: #060a14; color: #9fb4dc; font: 12px/1.5 ui-monospace, Consolas, monospace; white-space: pre-wrap; word-break: break-all; }
    #loading { position: fixed; inset: 0; z-index: 9000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: #05070f; transition: opacity .35s ease; }
    #loading.hide { opacity: 0; pointer-events: none; }
    #loading h1 { margin: 0; font-size: 28px; letter-spacing: .05em; }
    #loading p { margin: 0; color: #8fa8d8; font-size: 14px; }
    #bar { width: min(420px, 72vw); height: 10px; border-radius: 999px; background: rgba(255,255,255,.08); overflow: hidden; }
    #bar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #3f7dff, #6ce0ff); transition: width .15s linear; }
    @media (max-width: 900px) {
      #app { flex-direction: column; padding: 8px; }
      #side { width: 100%; flex-direction: row; flex-wrap: wrap; }
      #side .panel { flex: 1 1 160px; }
      #banner-slot, #log { display: none; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="stage">
      <canvas id="scene"></canvas>
      <div id="hud">
        <div class="row">
          <div class="chip">SCORE <span id="score">0</span></div>
          <div class="chip"><small>TIME</small> <span id="time">40</span>s</div>
        </div>
        <div class="row">
          <div class="chip"><small>点击金币收集</small></div>
          <div class="chip" id="mode-chip">MODE init…</div>
        </div>
      </div>
    </div>

    <aside id="side">
      <div class="panel">
        <h3>SDK</h3>
        <div class="btns">
          <button id="btn-again" class="primary">重新开始</button>
          <button id="btn-reward" class="warn">看广告 +40分</button>
          <button id="btn-banner">显示 Banner</button>
          <button id="btn-banner-clear">清除 Banner</button>
          <button id="btn-ranking">排行榜</button>
          <button id="btn-achievement">成就</button>
        </div>
      </div>
      <div class="panel">
        <h3>Banner 容器 (300×250)</h3>
        <div id="banner-slot">banner slot</div>
      </div>
      <div class="panel">
        <h3>Runtime log</h3>
        <pre id="log"></pre>
      </div>
    </aside>
  </div>

  <div id="loading">
    <h1>Coin Orbit</h1>
    <p id="loading-tip">初始化 Jogos SDK…</p>
    <div id="bar"><i></i></div>
  </div>

  <script src="../../shared/page-shell.js"></script>
  <script src="../../shared/jogos-bridge.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
      }
    }
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
